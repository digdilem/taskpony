# Example docker-compose.yml file for Taskpony.
# Copy this to a new directory and run "docker compose up -d" to fetch and run Taskpony on port 5000
# Updates to Taskpoint can be applied by "docker compose down && docker compose pull & docker compose up -d"

services:

  taskpony:
    # "latest" is recommended, but older versions are also available at https://hub.docker.com/r/digdilem/taskpony/tags
    image: 'digdilem/taskpony:latest'
    container_name: taskpony
    ports:
      # If you want Taskpony to be available on a different port, change the first number below to that port.
      - "5000:5000"
    volumes:
      # We need a persistent directory mounted in order to save our tasks database.
      - ./data:/opt/taskpony/db
    restart: unless-stopped

    # The optional healthcheck segment helps monitoring software check that Taskpony is running and responsive. If you change the port above, make sure to change it here as well.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

# End of file

